[project]
name = "devops-log-analyzer"
version = "0.1.0"
description = "AI Agent log analyzer for DevOps deployment pipelines powered by LangChain and Groq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.1.0",
    "langchain>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-experimental>=0.0.60",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["src"]